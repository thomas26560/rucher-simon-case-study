<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Rucher Simon product loop</title>
  <desc id="desc">The product loop connects field observation, structured visits, shared action, continuity and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#EFE4CD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#223A30" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5Z" fill="#9A7A3B"/>
    </marker>
  </defs>
  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <text x="720" y="70" text-anchor="middle" fill="#233D32" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="780">From one visit to the next</text>
  <text x="720" y="102" text-anchor="middle" fill="#6E796F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">A lightweight product loop designed around the beekeeper’s real working sequence.</text>

  <path d="M250 259H336M520 259H606M790 259H876M1060 259H1146" stroke="#9A7A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 160)">
      <rect width="180" height="198" rx="26" fill="#FFFFFF"/>
      <circle cx="90" cy="57" r="31" fill="#F6D77E"/>
      <path d="M74 64c12-25 29-25 36-20-5 19-15 29-36 20Z" fill="#A7681F"/>
      <text x="90" y="122" text-anchor="middle" fill="#233D32" font-size="18" font-weight="760">Observe</text>
      <text x="90" y="151" text-anchor="middle" fill="#6E796F" font-size="13">See the colony</text>
      <text x="90" y="171" text-anchor="middle" fill="#6E796F" font-size="13">in real conditions</text>
    </g>
    <g transform="translate(340 160)">
      <rect width="180" height="198" rx="26" fill="#FFFFFF"/>
      <circle cx="90" cy="57" r="31" fill="#DCEBDD"/>
      <rect x="77" y="40" width="27" height="35" rx="4" fill="none" stroke="#3F6C51" stroke-width="4"/>
      <path d="M82 37h17M82 50h17M82 60h12" stroke="#3F6C51" stroke-width="3" stroke-linecap="round"/>
      <text x="90" y="122" text-anchor="middle" fill="#233D32" font-size="18" font-weight="760">Structure</text>
      <text x="90" y="151" text-anchor="middle" fill="#6E796F" font-size="13">Record a clear,</text>
      <text x="90" y="171" text-anchor="middle" fill="#6E796F" font-size="13">repeatable visit</text>
    </g>
    <g transform="translate(610 160)">
      <rect width="180" height="198" rx="26" fill="#FFFFFF"/>
      <circle cx="90" cy="57" r="31" fill="#F4D9AE"/>
      <path d="M73 57l11 11 23-27" fill="none" stroke="#A65F1E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="122" text-anchor="middle" fill="#233D32" font-size="18" font-weight="760">Act</text>
      <text x="90" y="151" text-anchor="middle" fill="#6E796F" font-size="13">Turn observations</text>
      <text x="90" y="171" text-anchor="middle" fill="#6E796F" font-size="13">into follow-up</text>
    </g>
    <g transform="translate(880 160)">
      <rect width="180" height="198" rx="26" fill="#FFFFFF"/>
      <circle cx="90" cy="57" r="31" fill="#D7E6DE"/>
      <circle cx="81" cy="51" r="9" fill="none" stroke="#3F6C51" stroke-width="4"/>
      <circle cx="103" cy="63" r="9" fill="none" stroke="#3F6C51" stroke-width="4"/>
      <path d="M89 55l7 4" stroke="#3F6C51" stroke-width="4" stroke-linecap="round"/>
      <text x="90" y="122" text-anchor="middle" fill="#233D32" font-size="18" font-weight="760">Share</text>
      <text x="90" y="151" text-anchor="middle" fill="#6E796F" font-size="13">Keep context useful</text>
      <text x="90" y="171" text-anchor="middle" fill="#6E796F" font-size="13">across the team</text>
    </g>
    <g transform="translate(1150 160)">
      <rect width="220" height="198" rx="26" fill="#27483A"/>
      <circle cx="110" cy="57" r="31" fill="#F1C45C"/>
      <path d="M94 62c10-19 25-24 33-19-3 18-13 28-33 19Z" fill="#5B3B24"/>
      <text x="110" y="122" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="760">Improve</text>
      <text x="110" y="151" text-anchor="middle" fill="#D8E4DD" font-size="13">Use history to make</text>
      <text x="110" y="171" text-anchor="middle" fill="#D8E4DD" font-size="13">the next visit better</text>
    </g>
  </g>

  <path d="M1260 382c-86 80-945 80-1090 0" fill="none" stroke="#3E674F" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/>
  <text x="720" y="462" text-anchor="middle" fill="#4C6658" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing=".8">CONTINUITY, NOT JUST DATA ENTRY</text>
</svg>
